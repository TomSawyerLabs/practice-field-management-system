<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tomsawyerlabs.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard</title>
    <!-- Per-field Cast receiver, served by the backend. Loaded before both SDKs
         so the IDs below are already set. 404s harmlessly when the frontend is
         served by something other than pFMS, falling back to the defaults. -->
    <script src="/cast-config.js"></script>
    <!-- Cast Receiver SDK: only load on Chromecast (keeps session alive + listens for swap messages) -->
    <script>
      window.__isCastReceiver = navigator.userAgent.includes('CrKey');
      if (window.__isCastReceiver) {
        var s = document.createElement('script');
        s.src = '//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
        s.onload = function () {
          var ctx = cast.framework.CastReceiverContext.getInstance();
          var NAMESPACE = (window.__PFMS_CAST && window.__PFMS_CAST.namespace) || 'urn:x-cast:com.tomsawyerlabs.pfms';
          ctx.addCustomMessageListener(NAMESPACE, function (event) {
            try {
              var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
              if (data && data.deviceName) {
                localStorage.setItem('scoreboard-device-name', data.deviceName);
              }
              if (data && data.swap !== undefined && data.mute !== undefined) {
                // Combined session-start state: apply it all, reload once if
                // anything changed. `checks` is absent from older senders.
                var settings = { 'scoreboard-swap': data.swap, 'scoreboard-muted': data.mute };
                if (data.checks !== undefined) settings['scoreboard-checks'] = data.checks;
                var changed = false;
                for (var key in settings) {
                  var value = settings[key] ? '1' : '0';
                  if (localStorage.getItem(key) !== value) changed = true;
                  localStorage.setItem(key, value);
                }
                if (changed) window.location.reload();
              } else if (data && data.swap !== undefined) {
                localStorage.setItem('scoreboard-swap', data.swap ? '1' : '0');
                window.location.reload();
              } else if (data && data.mute !== undefined) {
                localStorage.setItem('scoreboard-muted', data.mute ? '1' : '0');
                window.location.reload();
              } else if (data && data.checks !== undefined) {
                localStorage.setItem('scoreboard-checks', data.checks ? '1' : '0');
                window.location.reload();
              }
            } catch (e) {}
          });
          ctx.start({ disableIdleTimeout: true }); // Non-media app — don't close when idle

          // Request a screen wake lock to prevent the TV's screensaver
          if (navigator.wakeLock) {
            navigator.wakeLock.request('screen').catch(function () {});
          }
        };
        document.head.appendChild(s);
      }
    </script>
    <!-- Cast Sender SDK: set callback BEFORE loading sender so timing works -->
    <script>
      var CAST_NAMESPACE = (window.__PFMS_CAST && window.__PFMS_CAST.namespace) || 'urn:x-cast:com.tomsawyerlabs.pfms';
      window['__onGCastApiAvailable'] = function (isAvailable) {
        if (!isAvailable) return;
        try {
          var ctx = cast.framework.CastContext.getInstance();
          ctx.setOptions({
            // A Cast receiver app is registered against a specific HTTPS URL,
            // so another field needs its own — see docs/scoreboard.md.
            receiverApplicationId: (window.__PFMS_CAST && window.__PFMS_CAST.appId) || '260A23F5',
            autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
          });
          // When a Cast session starts, send the current swap + mute + checks state to the receiver
          ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, function (event) {
            if (
              event.sessionState === cast.framework.SessionState.SESSION_STARTED ||
              event.sessionState === cast.framework.SessionState.SESSION_RESUMED
            ) {
              var swap = localStorage.getItem('scoreboard-swap') === '1';
              var mute = localStorage.getItem('scoreboard-muted') === '1';
              var checks = localStorage.getItem('scoreboard-checks') === '1';
              var session = ctx.getCurrentSession();
              if (session) {
                var deviceName = '';
                try {
                  deviceName = session.getCastDevice().friendlyName;
                } catch (e) {}
                session.sendMessage(
                  CAST_NAMESPACE,
                  JSON.stringify({ swap: swap, mute: mute, checks: checks, deviceName: deviceName }),
                );
              }
            }
          });
          window.__castReady = true;
        } catch (e) {
          console.warn('Cast init failed:', e);
        }
      };
      // Allow the scoreboard component to send swap/mute updates to the receiver
      window.__castSendSwap = function (swap) {
        try {
          var session = cast.framework.CastContext.getInstance().getCurrentSession();
          if (session) {
            session.sendMessage(CAST_NAMESPACE, JSON.stringify({ swap: swap }));
          }
        } catch (e) {}
      };
      window.__castSendMute = function (mute) {
        try {
          var session = cast.framework.CastContext.getInstance().getCurrentSession();
          if (session) {
            session.sendMessage(CAST_NAMESPACE, JSON.stringify({ mute: mute }));
          }
        } catch (e) {}
      };
      window.__castSendChecks = function (checks) {
        try {
          var session = cast.framework.CastContext.getInstance().getCurrentSession();
          if (session) {
            session.sendMessage(CAST_NAMESPACE, JSON.stringify({ checks: checks }));
          }
        } catch (e) {}
      };
    </script>
    <script src="//www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/roots/scores.tsx"></script>
  </body>
</html>
